<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist Skill — SkillMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.local.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="checklist" class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="index.html" class="text-lg font-bold tracking-tight text-slate-900">
        SkillMap
      </a>
      <nav class="flex items-center gap-1.5 text-sm font-medium sm:gap-2">
        <a
          href="index.html"
          class="rounded-lg px-3 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Beranda
        </a>
        <a
          href="input.html"
          class="rounded-lg px-3 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Analisis
        </a>
        <a
          href="riwayat.html"
          class="rounded-lg px-3 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Riwayat
        </a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-6 sm:px-6 sm:py-8">
    <section class="space-y-5">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
        <div>
          <div class="flex flex-wrap items-center gap-2">
            <h1 id="checklist-posisi" class="text-2xl font-bold text-slate-900"></h1>
            <span id="checklist-sample-badge" class="hidden rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-medium text-amber-800">
              Mode Contoh
            </span>
          </div>
          <p class="mt-1 text-sm text-slate-600">
            Centang skill yang sudah kamu kuasai saat ini.
          </p>
        </div>
        <a
          href="input.html"
          class="inline-flex shrink-0 items-center justify-center rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50"
        >
          Ubah lowongan
        </a>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-slate-200 bg-white p-3 sm:p-4">
        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            id="check-all-btn"
            class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50"
          >
            Pilih semua
          </button>
          <button
            type="button"
            id="uncheck-all-btn"
            class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50"
          >
            Hapus semua
          </button>
        </div>
        <button
          type="button"
          id="see-result-btn"
          class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700"
        >
          Lihat hasil
        </button>
      </div>

      <div id="checklist-container" class="space-y-4"></div>
    </section>
  </main>
</body>
</html>
