<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Analisis — SkillMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.local.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="riwayat" class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="index.html" class="text-lg font-bold tracking-tight text-slate-900">
        SkillMap
      </a>
      <nav class="flex items-center gap-1.5 text-sm font-medium sm:gap-2">
        <a
          href="index.html"
          class="rounded-lg px-3 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Beranda
        </a>
        <a
          href="input.html"
          class="rounded-lg px-3 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Analisis
        </a>
        <a
          href="riwayat.html"
          class="rounded-lg bg-slate-100 px-3 py-1.5 text-slate-900 transition"
        >
          Riwayat
        </a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-6 sm:px-6 sm:py-8">
    <section class="space-y-5">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Riwayat Analisis</h1>
          <p class="mt-1 text-sm text-slate-600">
            Maksimal 20 analisis terakhir tersimpan di browser ini.
          </p>
        </div>
        <div class="flex gap-2">
          <button
            type="button"
            id="clear-history-btn"
            class="hidden rounded-lg border border-rose-300 bg-white px-3.5 py-2 text-xs font-medium text-rose-700 hover:bg-rose-50"
          >
            Hapus semua
          </button>
          <a
            href="input.html"
            class="rounded-lg bg-indigo-600 px-3.5 py-2 text-xs font-semibold text-white hover:bg-indigo-700"
          >
            Analisis baru
          </a>
        </div>
      </div>

      <div id="history-empty" class="hidden rounded-xl border border-slate-200 bg-white p-8 text-center text-sm text-slate-500">
        Belum ada riwayat analisis. Mulai analisis lowongan pertamamu!
      </div>

      <ul id="history-list" class="space-y-3"></ul>
    </section>
  </main>
</body>
</html>
