<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Analisis | SkillMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;1,600&family=Syne:wght@700;800&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Syne"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="config.local.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body
  data-page="riwayat"
  class="min-h-screen bg-[#0C1210] font-sans text-[#F8FAFC] antialiased selection:bg-[#5EEAD4] selection:text-[#0C1210]"
  style="background-image: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(20, 62, 52, 0.35) 0%, rgba(12, 18, 16, 0) 75%);"
>
  <header class="border-b border-[#1D2B26] bg-[#0C1210]/90">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-4 sm:px-6">
      <a href="index.html" class="inline-flex items-center gap-2.5 text-[#F8FAFC] transition hover:opacity-85">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="text-[#5EEAD4]">
          <path
            d="M4 18.5C4 16.567 5.567 15 7.5 15H16.5C18.433 15 20 13.433 20 11.5C20 9.567 18.433 8 16.5 8H9"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <circle cx="7" cy="8" r="2.5" stroke="currentColor" stroke-width="2" />
          <circle cx="4" cy="18.5" r="2" fill="currentColor" />
        </svg>
        <span class="font-display text-base font-bold tracking-wider uppercase">SkillMap</span>
      </a>
      <nav class="flex items-center gap-1.5 text-sm font-medium sm:gap-2">
        <a href="index.html" class="rounded-lg px-3 py-1.5 text-[#A7B6B1] transition hover:bg-[#131C19] hover:text-[#F8FAFC]">
          Beranda
        </a>
        <a href="input.html" class="rounded-lg px-3 py-1.5 text-[#A7B6B1] transition hover:bg-[#131C19] hover:text-[#F8FAFC]">
          Analisis
        </a>
        <a href="riwayat.html" class="rounded-lg bg-[#182420] px-3 py-1.5 text-[#5EEAD4] transition">
          Riwayat
        </a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-6 sm:px-6 sm:py-8">
    <section class="space-y-5">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h1 class="font-display text-2xl font-bold text-[#F8FAFC]">Riwayat Analisis</h1>
          <p class="mt-1 text-sm text-[#A7B6B1]">
            Maksimal 20 analisis terakhir tersimpan di browser ini.
          </p>
        </div>
        <div class="flex gap-2">
          <button
            type="button"
            id="clear-history-btn"
            class="hidden min-h-[40px] rounded-full border border-rose-500/40 bg-rose-950/30 px-4 py-2 text-xs font-medium text-rose-300 hover:bg-rose-950/60"
          >
            Hapus semua
          </button>
          <a
            href="input.html"
            class="inline-flex min-h-[40px] items-center rounded-full bg-[#F8FAFC] px-4 py-2 text-xs font-semibold text-[#0C1210] hover:bg-[#D1FAE5]"
          >
            Analisis baru
          </a>
        </div>
      </div>

      <div id="history-empty" class="hidden rounded-xl border border-[#22322D] bg-[#131C19] p-8 text-center text-sm text-[#A7B6B1]">
        Belum ada riwayat analisis. Mulai analisis lowongan pertamamu!
      </div>

      <ul id="history-list" class="space-y-3"></ul>
    </section>
  </main>
</body>
</html>
