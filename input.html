<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analisis Lowongan | SkillMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;1,600&family=Syne:wght@700;800&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Syne"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="config.local.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body
  data-page="input"
  class="min-h-screen bg-[#0C1210] font-sans text-[#F8FAFC] antialiased selection:bg-[#5EEAD4] selection:text-[#0C1210]"
  style="background-image: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(20, 62, 52, 0.35) 0%, rgba(12, 18, 16, 0) 75%);"
>
  <header class="border-b border-[#1D2B26] bg-[#0C1210]/90">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-4 sm:px-6">
      <a href="index.html" class="inline-flex items-center gap-2.5 text-[#F8FAFC] transition hover:opacity-85">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="text-[#5EEAD4]">
          <path
            d="M4 18.5C4 16.567 5.567 15 7.5 15H16.5C18.433 15 20 13.433 20 11.5C20 9.567 18.433 8 16.5 8H9"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <circle cx="7" cy="8" r="2.5" stroke="currentColor" stroke-width="2" />
          <circle cx="4" cy="18.5" r="2" fill="currentColor" />
        </svg>
        <span class="font-display text-base font-bold tracking-wider uppercase">SkillMap</span>
      </a>
      <nav class="flex items-center gap-1.5 text-sm font-medium sm:gap-2">
        <a href="input.html" class="rounded-lg bg-[#182420] px-3 py-1.5 text-[#5EEAD4] transition">
          Analisis
        </a>
        <a href="riwayat.html" class="rounded-lg px-3 py-1.5 text-[#A7B6B1] transition hover:bg-[#131C19] hover:text-[#F8FAFC]">
          Riwayat
        </a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-6 sm:px-6 sm:py-8">
    <section class="space-y-6">
      <div>
        <h1 class="font-display text-2xl font-bold text-[#F8FAFC] sm:text-3xl">
          Cek Kesiapan Skill untuk Lowongan IT
        </h1>
        <p class="mt-1.5 text-sm text-[#A7B6B1] sm:text-base">
          Tempel teks lowongan kerja IT, tandai skill yang sudah kamu kuasai, lalu lihat persentase kecocokan dan roadmap belajarnya.
        </p>
      </div>

      <form id="analyze-form" class="space-y-5 rounded-xl border border-[#22322D] bg-[#131C19] p-4 sm:p-6" novalidate>
        <div>
          <div class="flex items-center justify-between">
            <label for="job-text-input" class="block text-sm font-medium text-[#F8FAFC]">
              Teks Lowongan Kerja IT
            </label>
            <span id="char-count" class="text-xs text-[#A7B6B1]">0 / 8000</span>
          </div>
          <textarea
            id="job-text-input"
            rows="10"
            placeholder="Tempel deskripsi dan kualifikasi lowongan kerja IT di sini (minimal 50 karakter)..."
            class="mt-2 block w-full rounded-lg border border-[#283B35] bg-[#0C1210] px-3.5 py-2.5 text-sm text-[#F8FAFC] placeholder-[#6B7F79] focus:border-[#5EEAD4] focus:outline-none focus:ring-1 focus:ring-[#5EEAD4]"
          ></textarea>
          <p id="input-error" class="mt-1.5 hidden text-xs font-medium text-rose-300"></p>
        </div>

        <div id="api-error-panel" class="hidden rounded-lg border border-rose-500/40 bg-rose-950/50 p-3.5 text-sm text-rose-200">
          <p id="api-error-message" class="font-medium"></p>
          <button
            type="button"
            id="retry-analyze-btn"
            class="mt-2 hidden rounded-md bg-rose-500 px-3 py-1.5 text-xs font-semibold text-white hover:bg-rose-600"
          >
            Coba lagi
          </button>
        </div>

        <div class="flex flex-col gap-2.5 sm:flex-row sm:items-center">
          <button
            type="submit"
            id="analyze-btn"
            class="inline-flex min-h-[44px] items-center justify-center gap-2 rounded-full bg-[#F8FAFC] px-6 py-2.5 text-sm font-semibold text-[#0C1210] transition hover:bg-[#D1FAE5] disabled:cursor-not-allowed disabled:opacity-60"
          >
            <span id="analyze-spinner" class="hidden h-4 w-4 animate-spin rounded-full border-2 border-[#0C1210] border-t-transparent"></span>
            <span id="analyze-btn-text">Analisis</span>
          </button>
          <button
            type="button"
            id="sample-btn"
            class="inline-flex min-h-[44px] items-center justify-center rounded-full border border-[#283B35] bg-[#182420] px-5 py-2.5 text-sm font-medium text-[#F8FAFC] transition hover:border-[#5EEAD4]/50 hover:bg-[#1D2B26] disabled:cursor-not-allowed disabled:opacity-60"
          >
            Pakai contoh lowongan
          </button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
