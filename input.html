<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analisis Lowongan — SkillMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.local.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="input" class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="index.html" class="text-lg font-bold tracking-tight text-slate-900">
        SkillMap
      </a>
      <nav class="flex items-center gap-1.5 text-sm font-medium sm:gap-2">
        <a
          href="index.html"
          class="rounded-lg px-3 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Beranda
        </a>
        <a
          href="input.html"
          class="rounded-lg bg-slate-100 px-3 py-1.5 text-slate-900 transition"
        >
          Analisis
        </a>
        <a
          href="riwayat.html"
          class="rounded-lg px-3 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Riwayat
        </a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-6 sm:px-6 sm:py-8">
    <section class="space-y-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 sm:text-3xl">
          Cek Kesiapan Skill untuk Lowongan IT
        </h1>
        <p class="mt-1.5 text-sm text-slate-600 sm:text-base">
          Tempel teks lowongan kerja IT, tandai skill yang sudah kamu kuasai, lalu lihat persentase kecocokan dan roadmap belajarnya.
        </p>
      </div>

      <form id="analyze-form" class="space-y-5 rounded-xl border border-slate-200 bg-white p-4 shadow-sm sm:p-6" novalidate>
        <div>
          <div class="flex items-center justify-between">
            <label for="job-text-input" class="block text-sm font-medium text-slate-700">
              Teks Lowongan Kerja IT
            </label>
            <span id="char-count" class="text-xs text-slate-500">0 / 8000</span>
          </div>
          <textarea
            id="job-text-input"
            rows="10"
            placeholder="Tempel deskripsi dan kualifikasi lowongan kerja IT di sini (minimal 50 karakter)..."
            class="mt-1.5 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
          ></textarea>
          <p id="input-error" class="mt-1.5 hidden text-xs font-medium text-rose-600"></p>
        </div>

        <div id="api-error-panel" class="hidden rounded-lg border border-rose-200 bg-rose-50 p-3.5 text-sm text-rose-800">
          <p id="api-error-message" class="font-medium"></p>
          <button
            type="button"
            id="retry-analyze-btn"
            class="mt-2 hidden rounded-md bg-rose-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-rose-700"
          >
            Coba lagi
          </button>
        </div>

        <div class="flex flex-col gap-2.5 sm:flex-row sm:items-center">
          <button
            type="submit"
            id="analyze-btn"
            class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-60"
          >
            <span id="analyze-spinner" class="hidden h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
            <span id="analyze-btn-text">Analisis</span>
          </button>
          <button
            type="button"
            id="sample-btn"
            class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-60"
          >
            Pakai contoh lowongan
          </button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
