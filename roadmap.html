<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadmap Belajar — SkillMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.local.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="roadmap" class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="index.html" class="text-lg font-bold tracking-tight text-slate-900">
        SkillMap
      </a>
      <nav class="flex items-center gap-1.5 text-sm font-medium sm:gap-2">
        <a
          href="index.html"
          class="rounded-lg px-3 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Beranda
        </a>
        <a
          href="input.html"
          class="rounded-lg px-3 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Analisis
        </a>
        <a
          href="riwayat.html"
          class="rounded-lg px-3 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Riwayat
        </a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-6 sm:px-6 sm:py-8">
    <section class="space-y-5">
      <div>
        <a
          href="hasil.html"
          class="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50"
        >
          &larr; Kembali ke hasil
        </a>
      </div>

      <div id="roadmap-loading" class="hidden rounded-xl border border-slate-200 bg-white p-8 text-center">
        <div class="mx-auto h-8 w-8 animate-spin rounded-full border-4 border-indigo-600 border-t-transparent"></div>
        <p class="mt-3 text-sm font-medium text-slate-700">
          Menyusun roadmap belajar...
        </p>
      </div>

      <div id="roadmap-error" class="hidden rounded-xl border border-rose-200 bg-rose-50 p-5 text-sm text-rose-800">
        <p id="roadmap-error-message" class="font-medium"></p>
        <div class="mt-3 flex flex-wrap gap-2">
          <button
            type="button"
            id="roadmap-retry-btn"
            class="hidden rounded-lg bg-rose-600 px-3.5 py-1.5 text-xs font-semibold text-white hover:bg-rose-700"
          >
            Coba lagi
          </button>
          <a
            href="hasil.html"
            class="rounded-lg border border-rose-300 bg-white px-3.5 py-1.5 text-xs font-medium text-rose-800 hover:bg-rose-100"
          >
            Kembali ke hasil
          </a>
        </div>
      </div>

      <div id="roadmap-content" class="hidden space-y-4">
        <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
          <div class="flex flex-wrap items-center gap-2">
            <h1 id="roadmap-skill" class="text-2xl font-bold text-slate-900"></h1>
            <span id="roadmap-sample-badge" class="hidden rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-medium text-amber-800">
              Roadmap Bawaan
            </span>
          </div>
          <p id="roadmap-posisi" class="mt-1 text-xs font-medium text-slate-500"></p>
          <p id="roadmap-ringkasan" class="mt-3 text-sm text-slate-700"></p>
        </div>

        <ol id="roadmap-steps" class="space-y-3"></ol>
      </div>
    </section>
  </main>
</body>
</html>
